# ==============================================
# CONFIGURACIÓN DEL PERFIL (PROFILE)
# ==============================================
# Perfil activo: development (para desarrollo local)
spring.profiles.active=development

# ==============================================
# CONFIGURACIÓN DE LA BASE DE DATOS (POSTGRESQL LOCAL)
# ==============================================
# Configuración de conexión para localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/progra02
spring.datasource.username=postgres
spring.datasource.password=1234

# Driver de PostgreSQL (versión actualizada para Spring Boot 4.1.0)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de pool de conexiones (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# ==============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================
# Dialecto para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL (Creación de tablas)
# update: actualiza el esquema automáticamente (ideal para desarrollo local)
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (para depuración)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# CONFIGURACIÓN DE THYMELEAF
# ==============================================
# Configuración básica de Thymeleaf
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Caché desactivada en desarrollo (para ver cambios en tiempo real)
spring.thymeleaf.cache=false

# ==============================================
# CONFIGURACIÓN DE RECURSOS ESTÁTICOS
# ==============================================
# Ubicación de recursos estáticos (CSS, JS, imágenes)
spring.web.resources.static-locations=classpath:/static/

# Cache desactivada en desarrollo
spring.web.resources.cache.period=0
spring.web.resources.cache.use-last-modified=true

# ==============================================
# CONFIGURACIÓN DEL SERVIDOR (TOMCAT EMBEBIDO)
# ==============================================
# Puerto del servidor (localhost:8080)
server.port=8080

# Tiempo de sesión (30 minutos)
server.servlet.session.timeout=30m

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==============================================
# CONFIGURACIÓN DE SPRING SECURITY
# ==============================================
# Configuración de sesión
server.servlet.session.cookie.max-age=30m

# (Opcional) Usuario por defecto para pruebas
# spring.security.user.name=admin
# spring.security.user.password=admin123
# spring.security.user.roles=ADMIN

# ==============================================
# CONFIGURACIÓN DE SPRING MAIL (CORREOS)
# ==============================================
# Configuración SMTP para Gmail (localhost)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_correo@gmail.com
spring.mail.password=tu_contraseña_app

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente
mail.from=tu_correo@gmail.com
mail.from.name=Hospital Clínico

# ==============================================
# CONFIGURACIÓN DE CACHÉ (CAFFEINE)
# ==============================================
# Caché con Caffeine para catálogos
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=3600s

# ==============================================
# CONFIGURACIÓN DE LOGGING
# ==============================================
# Nivel de logging general
logging.level.root=INFO

# Logging específico (DEBUG para desarrollo)
logging.level.com.hospital=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=DEBUG

# ==============================================
# CONFIGURACIÓN DE ACTUATOR (MONITOREO)
# ==============================================
# Habilitar endpoints de Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.info.build.enabled=true
management.info.env.enabled=true

# ==============================================
# PROPIEDADES PERSONALIZADAS (PARA TU APP)
# ==============================================
# Configuración de citas
app.appointment.reservation-timeout=5
app.appointment.min-advance-hours=2
app.appointment.max-active-citas=2
app.appointment.max-same-day=1

# Simulación de pago
app.payment.simulation.enabled=true
app.payment.simulation.success-rate=90

# DPI Guatemala
app.dpi.length=13
app.dpi.validation-enabled=true

# Intentos de login
app.security.max-login-attempts=5
app.security.lock-time-minutes=15

# ==============================================
# CONFIGURACIÓN DE FECHAS (JACKSON)
# ==============================================
# Formato de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Guatemala
# Nota: en Jackson 3.x (usado por Spring Boot 4) las fechas java.time ya
# se serializan en ISO-8601 por defecto; WRITE_DATES_AS_TIMESTAMPS ya no existe.

# ==============================================
# CONFIGURACIÓN DE SPRING DEVTOOLS (SOLO DESARROLLO)
# ==============================================
# Habilitar DevTools para recarga automática
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true

# ==============================================
# CONFIGURACIÓN DE SEGURIDAD (FRAME OPTIONS)
# ==============================================
# Permitir frames (para H2 console si la usaras)
# spring.security.headers.frame-options=DENY

# ==============================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS
# ==============================================
# Tamaño máximo de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================
# CONFIGURACIÓN DE MENSAJES (INTERNACIONALIZACIÓN)
# ==============================================
# Archivos de mensajes
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# Localidad por defecto (Guatemala)
spring.mvc.locale=es
spring.mvc.locale-resolver=accept_header

# ==============================================
# CONFIGURACIÓN DE JPA (PROPIEDADES ADICIONALES)
# ==============================================
# Tiempo de espera para consultas JPA
spring.jpa.properties.javax.persistence.query.timeout=30000
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================================
# CONFIGURACIÓN DE SPRING WEB (CORS - OPCIONAL)
# ==============================================
# Configuración de CORS para desarrollo local
# spring.web.cors.allowed-origins=http://localhost:3000
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
# spring.web.cors.allowed-headers=*

# ==============================================
# CONFIGURACIÓN DE LOGGING (ARCHIVOS)
# ==============================================
# Archivos de log para desarrollo
logging.file.name=logs/hospital-dev.log
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=10MB

# Patrón de logging
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# ==============================================
# CONFIGURACIÓN DE THYMELEAF (EXTRA)
# ==============================================
# Configuración de Thymeleaf para Spring Security
spring.thymeleaf.check-template-location=true
spring.thymeleaf.view-names=

# ==============================================
# CONFIGURACIÓN DE TOMCAT (OPCIONAL)
# ==============================================
# Tamaño máximo de peticiones
server.tomcat.max-http-form-post-size=2MB
server.tomcat.uri-encoding=UTF-8

# ==============================================
# CONFIGURACIÓN DE SPRING DATA (PAGINACIÓN)
# ==============================================
# Tamaño de página predeterminado
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

# ==============================================
# PERFIL DE DESARROLLO (POR SI USAS PROFILES SEPARADOS)
# ==============================================
# Estas propiedades solo se activan con el perfil 'development'
---
spring.config.activate.on-profile=development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
logging.level.com.hospital=DEBUG
server.error.include-exception=true
server.error.include-stacktrace=always